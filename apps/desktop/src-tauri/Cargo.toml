[package]
name = "takes-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
takes-audio = { version = "0.1.0", path = "../../../crates/takes-audio" }
takes-core = { version = "0.1.0", path = "../../../crates/takes-core" }
tauri = { version = "2.12.1", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-opener = "2.7.0"
